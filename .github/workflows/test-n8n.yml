name: Test Webhook Connection

on:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Test Hit n8n
        run: |
          echo "Mencoba mengirim data dummy ke n8n..."
          
          # Kita pakai Logo GitHub yang pasti servernya ON terus
          DUMMY_URL="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          
          curl -v --retry 3 \
            -X POST -H "Content-Type: application/json" \
            -d "{\"app_name\": \"TEST-CONNECTION\", \"version\": \"debug-mode\", \"download_url\": \"$DUMMY_URL\"}" \
            https://ai-n8n.nekosukuriputo.dev/webhook/github-apk-build
