name: Build Release Artifact

on:
  workflow_call:
  
env:
  APK_PATH: app/build/outputs/apk/release/app-release.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull upstream 🌏
        uses: actions/checkout@v4
        with:
          repository: DokiTeam/Doki
          ref: base
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 🚀
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 🚀
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK 🚀
        uses: android-actions/setup-android@v3

      - name: Build Release APK (Attempt 1) 💻
        run: |
          # Definisikan variabel dulu agar perintah gradle bersih
          TG_TOKEN=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json)
          # Mengambil hash commit 10 karakter pertama dari repo NekoSukuriputo
          EXTS_SHA=$(curl -s https://api.github.com/repos/NekoSukuriputo/doki-exts/commits/base -H "Accept: application/vnd.github.sha" | cut -c -10)
          
          echo "Using EXTS_SHA: $EXTS_SHA"

          ./gradlew assembleRelease \
            -Dtg_backup_bot_token="$TG_TOKEN" \
            -Dgh_username="${{ github.repository_owner }}" \
            -Dexts="$EXTS_SHA"
        continue-on-error: true

      - name: Build Release APK (Attempt 2) 💻
        run: |
          if [ ! -f ${{ env.APK_PATH }} ]; then
            echo "⚠️ Build attempt 1 failed, retrying..."
            pkill -f java || true
            
            TG_TOKEN=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json)
            EXTS_SHA=$(curl -s https://api.github.com/repos/NekoSukuriputo/doki-exts/commits/base -H "Accept: application/vnd.github.sha" | cut -c -10)

            ./gradlew assembleRelease \
              -Dtg_backup_bot_token="$TG_TOKEN" \
              -Dgh_username="${{ github.repository_owner }}" \
              -Dexts="$EXTS_SHA"
          else
            echo "✅ Release build already exists, skipping build attempt 2"
          fi
        continue-on-error: true

      - name: Build Release APK (Attempt 3) 💻
        run: |
          if [ ! -f ${{ env.APK_PATH }} ]; then
            echo "⚠️ Build attempt 2 failed, retrying..."
            pkill -f java || true
            
            TG_TOKEN=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json)
            EXTS_SHA=$(curl -s https://api.github.com/repos/NekoSukuriputo/doki-exts/commits/base -H "Accept: application/vnd.github.sha" | cut -c -10)

            ./gradlew assembleRelease \
              -Dtg_backup_bot_token="$TG_TOKEN" \
              -Dgh_username="${{ github.repository_owner }}" \
              -Dexts="$EXTS_SHA"
          else
            echo "✅ Release build already exists, skipping build attempt 3"
          fi
        continue-on-error: false

      - name: Upload APK artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Generate package 📦
        id: release_info
        run: |
          echo "tag=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "formatted_date=$(date +'%Y/%m/%d')" >> $GITHUB_OUTPUT
          mv app-release.apk release.apk

      - name: Upload to release 🌐
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Doki Build ${{ steps.release_info.outputs.tag }}"
          body: |
            Automated Doki builds, generated on ${{ steps.release_info.outputs.formatted_date }}
          files: release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🔔 Trigger n8n to Download & Send
        if: success()
        run: |
          APP_NAME="Doki-App"
          VERSION="${{ steps.release_info.outputs.tag }}"
          
          # Link GitHub Release Resmi
          GITHUB_URL="https://github.com/${{ github.repository }}/releases/download/$VERSION/release.apk"
          
          echo "📨 Menyuruh n8n mendownload dari: $GITHUB_URL"
          
          # Kita cuma kirim Teks URL. Tidak kirim file fisik.
          # Ini sangat cepat dan tidak mungkin corrupt.
          
          curl -v --retry 3 \
            "https://ai-n8n.nekosukuriputo.dev/webhook/github-apk-build?app_name=$APP_NAME&version=$VERSION&github_url=$GITHUB_URL"
