name: Build Release Artifact

on:
  workflow_call:
  
env:
  APK_PATH: app/build/outputs/apk/release/app-release.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull upstream 🌏
        uses: actions/checkout@v4
        with:
          repository: DokiTeam/Doki
          ref: base
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 🚀
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 🚀
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK 🚀
        uses: android-actions/setup-android@v3

      - name: Build Release APK (Attempt 1) 💻
        run: |
          ./gradlew assembleRelease \
          -Dtg_backup_bot_token=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json) \
          -Dgh_username=${{ github.repository_owner }} \
          -Dexts=$(curl -s https://api.github.com/repos/DokiTeam/doki-exts/commits/base -H "Accept: application/vnd.github.sha" | cut -c -10)
        continue-on-error: true

      - name: Build Release APK (Attempt 2) 💻
        run: >-
          if [ ! -f ${{ env.APK_PATH }} ]; then
            pkill -f java &&
            ./gradlew assembleRelease \
          -Dtg_backup_bot_token=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json) \
          -Dgh_username=${{ github.repository_owner }} \
          -Dexts=$(curl -s https://api.github.com/repos/DokiTeam/doki-exts/commits/base -H "Accept: application/vnd.github.sha" | cut -c -10)
          else
            echo "✅ Release build already exists, skipping build attempt 2";
          fi
        continue-on-error: true

      - name: Build Release APK (Attempt 3) 💻
        run: >-
          if [ ! -f ${{ env.APK_PATH }} ]; then
            pkill -f java &&
            ./gradlew assembleRelease \
          -Dtg_backup_bot_token=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json) \
          -Dgh_username=${{ github.repository_owner }} \
          -Dexts=$(curl -s https://api.github.com/repos/DokiTeam/doki-exts/commits/base -H "Accept: application/vnd.github.sha" | cut -c -10)
          else
            echo "✅ Release build already exists, skipping build attempt 3";
          fi
        continue-on-error: false

      - name: Upload APK artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Generate package 📦
        id: release_info
        run: |
          echo "tag=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "formatted_date=$(date +'%Y/%m/%d')" >> $GITHUB_OUTPUT
          mv app-release.apk release.apk

      - name: Upload to release 🌐
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Doki Build ${{ steps.release_info.outputs.tag }}"
          body: |
            Automated Doki builds, generated on ${{ steps.release_info.outputs.formatted_date }}
          files: release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 📤 Upload APK & Notify Telegram via n8n
        if: success() # Hanya jalan jika build sukses
        run: |
          echo "🔍 Mencari file APK..."
          # Mencari file APK di direktori (biasanya di build/app/outputs/flutter-apk/ atau release/)
          # Perintah ini akan mengambil file APK pertama yang ditemukan
          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "❌ File APK tidak ditemukan!"
            exit 1
          fi

          APP_NAME=$(basename "$APK_PATH" .apk)
          echo "✅ Menemukan: $APP_NAME di $APK_PATH"

          # Upload ke transfer.sh agar n8n bisa mengambilnya (Link berlaku 14 hari)
          echo "🚀 Mengupload ke public storage..."
          DOWNLOAD_URL=$(curl --upload-file "$APK_PATH" "https://transfer.sh/$APP_NAME.apk")
          
          echo "🔗 Public Link: $DOWNLOAD_URL"

          # Trigger Webhook n8n
          # Ganti URL di bawah dengan URL n8n Production kamu
          echo "📨 Mengirim notifikasi ke n8n..."
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"app_name\": \"$APP_NAME\", \"version\": \"${{ github.run_number }}\", \"download_url\": \"$DOWNLOAD_URL\"}" \
            https://ai-n8n.nekosukuriputo.dev/webhook-test/github-apk-build
