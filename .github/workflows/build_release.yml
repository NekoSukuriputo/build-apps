name: Build Release Artifact

on:
  workflow_call:
  
env:
  APK_PATH: app/build/outputs/apk/release/app-release.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull upstream 🌏
        uses: actions/checkout@v4
        with:
          repository: DokiTeam/Doki
          ref: base
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 🚀
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 🚀
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK 🚀
        uses: android-actions/setup-android@v3

      - name: Build Release APK (Attempt 1) 💻
        run: |
          ./gradlew assembleRelease \
          -Dtg_backup_bot_token=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json) \
          -Dgh_username=${{ github.repository_owner }} \
          -Dexts=$(curl -s https://api.github.com/repos/DokiTeam/doki-exts/commits/base -H "Accept: application/vnd.github.sha" | cut -c -10)
        continue-on-error: true

      - name: Build Release APK (Attempt 2) 💻
        run: >-
          if [ ! -f ${{ env.APK_PATH }} ]; then
            pkill -f java &&
            ./gradlew assembleRelease \
          -Dtg_backup_bot_token=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json) \
          -Dgh_username=${{ github.repository_owner }} \
          -Dexts=$(curl -s https://api.github.com/repos/DokiTeam/doki-exts/commits/base -H "Accept: application/vnd.github.sha" | cut -c -10)
          else
            echo "✅ Release build already exists, skipping build attempt 2";
          fi
        continue-on-error: true

      - name: Build Release APK (Attempt 3) 💻
        run: >-
          if [ ! -f ${{ env.APK_PATH }} ]; then
            pkill -f java &&
            ./gradlew assembleRelease \
          -Dtg_backup_bot_token=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json) \
          -Dgh_username=${{ github.repository_owner }} \
          -Dexts=$(curl -s https://api.github.com/repos/DokiTeam/doki-exts/commits/base -H "Accept: application/vnd.github.sha" | cut -c -10)
          else
            echo "✅ Release build already exists, skipping build attempt 3";
          fi
        continue-on-error: false

      - name: Upload APK artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Generate package 📦
        id: release_info
        run: |
          echo "tag=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "formatted_date=$(date +'%Y/%m/%d')" >> $GITHUB_OUTPUT
          mv app-release.apk release.apk

      - name: Upload to release 🌐
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Doki Build ${{ steps.release_info.outputs.tag }}"
          body: |
            Automated Doki builds, generated on ${{ steps.release_info.outputs.formatted_date }}
          files: release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 📤 Upload to TmpFiles & Notify n8n
        if: success()
        run: |
          APP_NAME="Doki-App"
          VERSION="${{ steps.release_info.outputs.tag }}"
          APK_PATH="release.apk"
          
          # 1. Link Permanen (GitHub Release) untuk ditampilkan di Teks Pesan
          GITHUB_URL="https://github.com/${{ github.repository }}/releases/tag/$VERSION"
          
          echo "🚀 Mengupload ke TmpFiles.org (Helper)..."
          RESPONSE=$(curl -F "file=@$APK_PATH" https://tmpfiles.org/api/v1/upload)
          PREVIEW_URL=$(echo $RESPONSE | grep -o 'https://tmpfiles.org/[^"]*')
          
          # 2. Link Sementara (Direct) untuk Bot mengupload File
          # Ubah jadi direct link (/dl/)
          TEMP_UPLOAD_URL=$(echo $PREVIEW_URL | sed 's/tmpfiles.org\//tmpfiles.org\/dl\//')
          
          if [ -z "$TEMP_UPLOAD_URL" ]; then
             echo "❌ Gagal upload ke TmpFiles"
             exit 1
          fi

          echo "📨 Mengirim notifikasi ke n8n..."
          # Perhatikan payload JSON di bawah, kita kirim 2 link berbeda
          curl -v --retry 5 \
            -X POST -H "Content-Type: application/json" \
            -d "{\"app_name\": \"$APP_NAME\", \"version\": \"$VERSION\", \"github_url\": \"$GITHUB_URL\", \"upload_url\": \"$TEMP_UPLOAD_URL\"}" \
            https://ai-n8n.nekosukuriputo.dev/webhook/github-apk-build
